<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>흔들갈대 - 개인 홈페이지</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- FullCalendar 라이브러리 업데이트 -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/main.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/main.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/locales/ko.min.js"></script>
  
  <!-- 차트 라이브러리 추가 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  
  <!-- RichText 편집기 추가 -->
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
  
  <!-- Firebase 라이브러리 -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  
  <!-- 메인 스타일시트 -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <script>
  // ===== 토스트 알림 (alert 대체: 화면을 멈추지 않고 잠깐 표시) =====
  (function () {
    var MAX_TOASTS = 3;

    function getContainer() {
      var c = document.getElementById('toast-container');
      if (!c) {
        c = document.createElement('div');
        c.id = 'toast-container';
        c.className = 'toast-container';
        c.setAttribute('role', 'status');
        c.setAttribute('aria-live', 'polite');
        document.body.appendChild(c);
      }
      return c;
    }

    function guessType(text) {
      if (/오류|실패|에러|불가|없습니다|올바르지|잘못/.test(text)) return 'error';
      if (/완료|저장되었|삭제되었|추가되었|수정되었|성공/.test(text)) return 'success';
      return 'info';
    }

    // options: { type, duration, action: { label, onClick } }
    window.showToast = function (message, options) {
      options = options || {};
      var text = String(message === undefined || message === null ? '' : message);
      if (!text) return;
      var container = getContainer();

      // 같은 문구가 이미 떠 있으면 중복해서 쌓지 않음
      var existing = container.querySelectorAll('.toast-message');
      for (var i = 0; i < existing.length; i++) {
        if (existing[i].textContent === text) return;
      }
      while (container.children.length >= MAX_TOASTS) {
        container.removeChild(container.firstChild);
      }

      var type = options.type || guessType(text);
      var toast = document.createElement('div');
      toast.className = 'toast toast-' + type;

      var msg = document.createElement('span');
      msg.className = 'toast-message';
      msg.textContent = text;
      toast.appendChild(msg);

      function dismiss() {
        if (!toast.parentNode) return;
        toast.classList.remove('show');
        setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 200);
      }

      if (options.action && options.action.label) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'toast-action';
        btn.textContent = options.action.label;
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          dismiss();
          if (typeof options.action.onClick === 'function') options.action.onClick();
        });
        toast.appendChild(btn);
      }

      toast.addEventListener('click', dismiss);
      container.appendChild(toast);
      requestAnimationFrame(function () { toast.classList.add('show'); });

      var duration = options.duration || (options.action ? 10000 : (type === 'error' ? 5000 : 3200));
      setTimeout(dismiss, duration);
    };

    // 기존 코드의 alert()가 화면을 멈추지 않도록 토스트로 대체
    window.alert = function (message) { window.showToast(message); };
  })();

  // ===== 전역 오류 처리 =====
  (function () {
    var lastShownAt = 0;
    function notifyOnce(text) {
      var now = Date.now();
      if (now - lastShownAt < 5000) return; // 오류가 연달아 나도 5초에 한 번만 안내
      lastShownAt = now;
      window.showToast(text, { type: 'error' });
    }

    function isBenign(text) {
      // 사용자에게 알릴 필요 없는 브라우저/외부 스크립트 경고
      return /ResizeObserver loop|^Script error\.?$|AbortError|The user aborted a request|Load failed|NetworkError when attempting to fetch|play\(\) request was interrupted|play\(\) failed because the user didn/i.test(String(text || ''));
    }

    window.onerror = function (message, source, lineno, colno, error) {
      console.error('오류 상세:', { message: message, source: source, lineno: lineno, colno: colno, error: error });
      if (!isBenign(message)) notifyOnce('일시적인 오류가 발생했습니다. 계속 반복되면 새로고침해 주세요.');
      return false;
    };

    window.addEventListener('unhandledrejection', function (event) {
      console.error('비동기 오류 상세:', event.reason);
      var reason = event.reason && event.reason.message ? event.reason.message : event.reason;
      if (!isBenign(reason)) notifyOnce('처리 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
    });
  })();

  // DOM 로드 완료 후 화면이 비어 있으면 한 번만 자동 새로고침 (무한 새로고침 방지)
  document.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () {
      var appElem = document.getElementById('app');
      if (appElem && appElem.innerHTML.trim()) return;

      var last = 0;
      try { last = Number(sessionStorage.getItem('renderReloadAt') || 0); } catch (e) {}
      if (Date.now() - last > 60000) {
        try { sessionStorage.setItem('renderReloadAt', String(Date.now())); } catch (e) {}
        window.location.reload();
      } else {
        window.showToast('화면을 불러오지 못했습니다. 새로고침해 주세요.', {
          type: 'error',
          action: { label: '새로고침', onClick: function () { window.location.reload(); } }
        });
      }
    }, 3000);
  });
</script>
  <div id="app">
    <!-- 앱 콘텐츠가 인증 여부에 따라 여기에 표시됩니다 -->
  </div>

<!-- 주요 스크립트 - Firebase 구성 먼저 로드 (중복 제거) -->
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  
  <!-- 페이지 로드 시 음악 및 비디오 자동 재생 처리 -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // DOM이 로드된 후 배경음악 및 비디오 재생 시도
      setTimeout(function() {
        const bgMusic = document.getElementById('background-music');
        if(bgMusic) {
          bgMusic.play().catch(e => console.log("음악 자동 재생이 차단되었습니다: ", e));
        }
        
        const videos = document.querySelectorAll('video');
        videos.forEach(video => {
          if(video.paused) {
            video.play().catch(e => console.log("비디오 자동 재생이 차단되었습니다: ", e));
          }
        });
      }, 1000);
      
      // 사용자 상호작용 시 배경음악 재생
      document.addEventListener('click', function() {
        const bgMusic = document.getElementById('background-music');
        if(bgMusic && bgMusic.paused) {
          bgMusic.play().catch(e => console.log("음악 재생 오류: ", e));
        }
      }, {once: true});
    });
  </script>
<!-- 오류 복구 스크립트 -->
<script>
  // 코드 자체가 깨진 듯한 오류가 나면 새로고침 버튼이 달린 토스트를 한 번만 보여줌
  (function () {
    var offered = false;
    window.addEventListener('error', function (e) {
      var msg = (e && e.message) || '';
      if (offered || !(msg.indexOf('Unexpected token') >= 0 || msg.indexOf('is not defined') >= 0)) return;
      offered = true;
      window.showToast('페이지에 오류가 발생했습니다.', {
        type: 'error',
        action: { label: '새로고침', onClick: function () { window.location.reload(); } }
      });
    });
  })();
</script>
</body>
</html>
